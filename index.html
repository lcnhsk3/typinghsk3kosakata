    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(135deg, #f9d56e, #f8b042);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2), 0 0 0 8px #ff8a5c, 0 0 0 12px #f5e56b;
            padding: 24px;
            border: 5px dashed #ff5e6b;
            position: relative;
        }

        /* Kepala Shinchan di pojok */
        .shinchan-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffb347;
            padding: 15px 25px;
            border-radius: 100px 100px 30px 30px;
            margin-bottom: 25px;
            border: 4px solid #e06641;
            box-shadow: 0 8px 0 #b44d2e;
        }

        .shinchan-avatar {
            font-size: 60px;
            filter: drop-shadow(4px 6px 0 #ffef9f);
        }

        .shinchan-avatar i {
            background: #fdd0b5;
            border-radius: 50%;
            padding: 10px;
            border: 4px solid #e6845e;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #4b2e1b;
            text-shadow: 3px 3px 0 #fbf1a4;
            background: #fff0b5;
            padding: 8px 25px;
            border-radius: 40px;
            border: 3px solid #e6a345;
            transform: rotate(-2deg);
        }

        .progress-card {
            background: #b0e57c;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 22px;
            font-weight: bold;
            color: #2d5e1e;
            display: inline-block;
            border: 4px solid #6b8c42;
            margin-bottom: 25px;
            box-shadow: 0 6px 0 #4f6b31;
        }

        .soal-box {
            background: #fee599;
            border-radius: 70px 70px 30px 30px;
            padding: 30px 20px;
            border: 5px solid #fbb03b;
            box-shadow: inset 0 -8px 0 #e69a2e, 0 15px 0 #c57c1f;
            margin-bottom: 30px;
        }

        .arti-text {
            font-size: 36px;
            text-align: center;
            color: #3f2b15;
            background: #fffbe3;
            display: inline-block;
            padding: 10px 40px;
            border-radius: 50px;
            margin-bottom: 25px;
            border: 4px dashed #ff8a5c;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .hanzi-input-wrapper {
            position: relative;
            width: 100%;
        }

        .hanzi-input {
            width: 100%;
            font-size: 48px;
            padding: 20px 25px;
            font-family: 'Comic Neue', 'KaiTi', '楷体', 'STKaiti', serif;
            text-align: center;
            background: #fffef7;
            border: 6px solid #fece6b;
            border-radius: 80px;
            outline: none;
            color: #2c3e50;
            box-shadow: 0 8px 0 #d4a15a, inset 0 2px 10px #ffeeaa;
            transition: 0.1s;
            letter-spacing: 4px;
        }

        .hanzi-input:focus {
            border-color: #ff8a5c;
            box-shadow: 0 8px 0 #c5653c, inset 0 2px 10px #ffe48f;
        }

        .audio-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: #ff6f61;
            border: none;
            font-size: 32px;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #b1453b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .audio-btn:active {
            transform: translateY(-50%) scale(0.9);
            box-shadow: 0 2px 0 #b1453b;
        }

        .feedback {
            font-size: 28px;
            margin-top: 20px;
            padding: 15px;
            border-radius: 50px;
            text-align: center;
            background: #feebc0;
            border: 4px solid #ffb248;
            min-height: 85px;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin: 30px 0 15px;
        }

        .btn {
            font-family: 'Comic Neue', cursive;
            font-size: 32px;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 60px;
            background: #fdd023;
            color: #423111;
            border-bottom: 8px solid #c7951e;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 0 #9e7518;
        }

        .btn:active {
            transform: translateY(5px);
            border-bottom-width: 3px;
        }

        .btn-submit {
            background: #6fda6f;
            border-bottom-color: #2e8b2e;
        }

        .btn-next {
            background: #6ec8e0;
            border-bottom-color: #36859b;
        }

        .footer-email {
            font-size: 18px;
            color: #6b3f00;
            background: #fffacd;
            border-radius: 30px;
            padding: 8px 15px;
            text-align: center;
            border: 2px solid #e6a345;
        }

        /* dekorasi lucu */
        .decor {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            pointer-events: none;
        }

        .decor1 { top: 10px; left: 10px; transform: rotate(-15deg); }
        .decor2 { bottom: 10px; right: 10px; transform: rotate(20deg); }
    </style>
</head>

    <div class="footer-email">

    <!-- dekorasi lucu -->
    <div class="decor decor1">🧸</div>
    <div class="decor decor2">🍙</div>

        // ========== State & Variabel Global ==========
        const totalSoal = vocab.length;
        let currentIndex = 0; // 0-based
        let jawabanUser = JSON.parse(localStorage.getItem('shinchanHSK3')) || []; // array { jawaban: string, benar: boolean } atau null jika belum dijawab
        let emailTerkirim = false;

        // Elemen DOM
        const soalArtiEl = document.getElementById('soalArti');
        const jawabanInput = document.getElementById('jawabanInput');
        const feedbackArea = document.getElementById('feedbackArea');
        const progressDisplay = document.getElementById('progressDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const nextBtn = document.getElementById('nextBtn');
        const audioBtn = document.getElementById('audioBtn');

        // ========== Fungsi bantuan ==========
        function simpanKeStorage() {
            localStorage.setItem('shinchanHSK3', JSON.stringify(jawabanUser));
        }

        function updateTampilanSoal() {
            const soal = vocab[currentIndex];
            soalArtiEl.innerText = soal.indonesia;
            // cek apakah sudah pernah dijawab
            if (jawabanUser[currentIndex] && jawabanUser[currentIndex].jawaban !== undefined) {
                jawabanInput.value = jawabanUser[currentIndex].jawaban || '';
                // tampilkan feedback sesuai status
                if (jawabanUser[currentIndex].benar) {
                    feedbackArea.innerHTML = '✅ Benar! ' + (soal.pinyin ? '(' + soal.pinyin + ')' : '');
                } else {
                    feedbackArea.innerHTML = '❌ Salah. Jawaban benar: ' + soal.hanzi + ' (' + soal.pinyin + ')';
                }
            } else {
                jawabanInput.value = '';
                feedbackArea.innerHTML = '✏️ Tulis jawaban di kotak, lalu tekan submit!';
            }
            progressDisplay.innerText = `Soal ${currentIndex+1} / ${totalSoal}`;
        }

        // Fungsi baca hanzi (audio)
        function playAudio() {
            const teks = vocab[currentIndex].hanzi;
            if (teks && window.speechSynthesis) {
                const utterance = new SpeechSynthesisUtterance(teks);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                speechSynthesis.cancel(); // Hentikan yang sedang berjalan
                speechSynthesis.speak(utterance);
            } else {
                alert('Browser tidak mendukung text-to-speech');
            }
        }

        // Fungsi kirim email via EmailJS (WAJIB ganti public key & service ID)
        function kirimEmail() {
            if (emailTerkirim) return; // hindari kirim berkali-kali
            // Hitung statistik
            let totalTerjawab = 0;
            let totalBenar = 0;
            const detail = jawabanUser.map((item, idx) => {
                if (item && item.jawaban !== undefined) {
                    totalTerjawab++;
                    if (item.benar) totalBenar++;
                    return `${idx+1}. ${vocab[idx].indonesia} -> jawab: ${item.jawaban} (${item.benar ? '✔️' : '✖️'}) benar: ${vocab[idx].hanzi}`;
                } else {
                    return `${idx+1}. ${vocab[idx].indonesia} -> belum dijawab`;
                }
            }).join('\n');

            const message = `Hasil Game HSK3 Shinchan:\n\nTotal Soal: ${totalSoal}\nTerjawab: ${totalTerjawab}\nBenar: ${totalBenar}\nSalah: ${totalTerjawab - totalBenar}\n\nDetail:\n${detail}`;

            // Parameter EmailJS - sesuaikan dengan template mu!
            const templateParams = {
                to_email: 'lcnhsk3palembang@gmail.com',
                subject: 'Laporan Game HSK3 Shinchan',
                message: message
            };

            // Ganti 'YOUR_SERVICE_ID' dan 'YOUR_TEMPLATE_ID' dengan milikmu
            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(() => {
                    console.log('Email berhasil dikirim');
                    emailTerkirim = true;
                })
                .catch((err) => {
                    console.error('Gagal kirim email:', err);
                    alert('Gagal mengirim email. Pastikan konfigurasi EmailJS benar.');
                });
        }

        // Fungsi saat submit
        function handleSubmit() {
            const jawaban = jawabanInput.value.trim();
            const soal = vocab[currentIndex];
            const benar = (jawaban === soal.hanzi); // bandingkan persis
            // Simpan ke array
            jawabanUser[currentIndex] = {
                jawaban: jawaban,
                benar: benar
            };
            simpanKeStorage();

            // Tampilkan feedback
            if (benar) {
                feedbackArea.innerHTML = '✅ Benar! ' + (soal.pinyin ? '(' + soal.pinyin + ')' : '');
            } else {
                feedbackArea.innerHTML = '❌ Salah. Jawaban benar: ' + soal.hanzi + ' (' + soal.pinyin + ')';
            }

            // Cek apakah semua soal sudah dijawab (tidak ada undefined)
            const semuaTerjawab = jawabanUser.length === totalSoal && jawabanUser.every(item => item !== undefined);
            if (semuaTerjawab && !emailTerkirim) {
                kirimEmail();
            }
        }

        // Fungsi next
        function handleNext() {
            if (currentIndex < totalSoal - 1) {
                currentIndex++;
                updateTampilanSoal();
            } else {
                // sudah di soal terakhir, loop ke awal atau tampilkan pesan
                if (confirm('Kamu sudah sampai soal terakhir! Kembali ke awal?')) {
                    currentIndex = 0;
                    updateTampilanSoal();
                }
            }
        }

        // Event beforeunload: kirim email jika ada data dan belum terkirim
        window.addEventListener('beforeunload', function() {
            if (jawabanUser.length > 0 && !emailTerkirim) {
                // Gunakan sendBeacon agar lebih reliable saat unload
                const data = {
                    to_email: 'lcnhsk3palembang@gmail.com',
                    subject: 'Laporan Game HSK3 (auto refresh)',
                    message: 'Data dikirim saat refresh. Lihat localStorage untuk detail.'
                };
                // Kirim via EmailJS tidak bisa via sendBeacon, kita fallback ke fetch sinkron? Sulit.
                // Untuk kemudahan, kita panggil kirimEmail() secara biasa, mungkin tidak sempat.
                // Alternatif: kita simpan flag dan kirim saat load berikutnya? 
                // Di sini kita panggil kirimEmail, semoga sempat.
                kirimEmail();
            }
        });

        // Inisialisasi: load soal pertama dan event listeners
        function init() {
            // Jika jawabanUser belum sesuai panjang, inisialisasi array
            if (jawabanUser.length < totalSoal) {
                // isi dengan undefined untuk yang kurang
                jawabanUser = jawabanUser.concat(new Array(totalSoal - jawabanUser.length).fill(undefined));
            } else if (jawabanUser.length > totalSoal) {
                jawabanUser = jawabanUser.slice(0, totalSoal);
            }
            simpanKeStorage();
            updateTampilanSoal();

            submitBtn.addEventListener('click', handleSubmit);
            nextBtn.addEventListener('click', handleNext);
            audioBtn.addEventListener('click', playAudio);

            // Enter di input memicu submit
            jawabanInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                }
            });
